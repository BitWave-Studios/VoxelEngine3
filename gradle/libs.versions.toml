socialsdk = { group = "net.derfruhling.discord", name = "socialsdk", version.ref = "socialsdk4jVersion" }
socialsdk4j-bom = { group = "net.derfruhling.discord", name = "socialsdk4j-bom", version = "1.0-SNAPSHOT" }
socialsdk4j = { group = "net.derfruhling.discord", name = "socialsdk4j", version = "1.0-SNAPSHOT" }

tinylog-api = { group = "org.tinylog", name = "tinylog-api", version.ref = "tinylogVersion" }
tinylog-impl = { group = "org.tinylog", name = "tinylog-impl", version.ref = "tinylogVersion" }
